<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de fotos</title>
    <link rel="stylesheet" href="css/main_style.css" />
    <link rel="stylesheet" href="css/galeria.css" />
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <h1>Galería de fotos</h1>
        <section class="carusel">
            <section class="carusel-trail">
                <section>
                    <img src="img/entrega-viveres-rural.jpg" alt="Entrega de víveres en zona rural" />
                    <div class="caption">Entrega de víveres en zona rural</div>
                </section>
                <section>
                    <img src="img/jornada-basilica.jpg" alt="Jornada en la Basílica" />
                    <div class="caption">Jornada de ayuda en la Basílica</div>
                </section>
                <section>
                    <img src="img/nino-basilica.jpg" alt="Niño beneficiado en la Basílica" />
                    <div class="caption">Niños beneficiados en la jornada</div>
                </section>
                <section>
                    <img src="img/reparto-mascarillas.jpg" alt="Reparto de mascarillas" />
                    <div class="caption">Reparto de mascarillas</div>
                </section>
                <section>
                    <img src="img/campana-una-bolsa.jpg" alt="Campaña Una Bolsa" />
                    <div class="caption">Campaña "Una Bolsa"</div>
                </section>
                <section>
                    <img src="img/voluntarios-panah.jpg" alt="Voluntarios de PANAH" />
                    <div class="caption">Nuestros voluntarios en acción</div>
                </section>
            </section>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="js/carusel.js"></script>
    <script src="js/galeria.js"></script>
    <script src="js/incluir.js"></script>
</body>
</html>
