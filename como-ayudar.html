<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cómo Ayudar | PANAH</title>

    <meta
        name="description"
        content="Descubre cómo ayudar a PANAH mediante donaciones, voluntariado, entrega de insumos y difusión de sus campañas en Honduras."
    >
    <meta name="theme-color" content="#ff9d00">

    <meta property="og:title" content="Cómo Ayudar | PANAH">
    <meta
        property="og:description"
        content="Encuentra una forma de apoyar las campañas solidarias de Proyecto Amigos Nutriendo a Honduras."
    >
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_HN">

    <link rel="stylesheet" href="css/main_style.css">
    <link rel="stylesheet" href="css/como-ayudar.css">
</head>

<body class="pagina-ayudar">
    <a class="ayudar-saltar" href="#contenido">Saltar al contenido</a>
    <div id="header-placeholder"></div>

    <main id="contenido">
        <section class="ayudar-portada ayudar-seccion" aria-labelledby="titulo-como-ayudar">
            <div class="ayudar-contenedor ayudar-portada-grid">
                <div class="ayudar-portada-contenido">
                    <p class="ayudar-etiqueta">Sumate a la causa</p>
                    <h1 id="titulo-como-ayudar">
                        Tu ayuda encuentra
                        <span>una forma de llegar.</span>
                    </h1>
                    <p class="ayudar-resumen">
                        Tu tiempo, tus aportes y tu voz pueden convertirse en apoyo
                        concreto para personas y familias hondureñas.
                    </p>
                    <div class="ayudar-acciones">
                        <a class="ayudar-boton ayudar-boton-principal" href="donaciones.html">
                            Hacer una donación
                        </a>
                        <a
                            class="ayudar-boton ayudar-boton-claro"
                            href="https://www.instagram.com/panah_504/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Ver campañas activas
                        </a>
                    </div>
                </div>

                <figure class="ayudar-portada-imagen">
                    <img
                        src="img/campana-una-bolsa.jpg"
                        alt="Persona recibe una bolsa con alimentos durante una entrega solidaria"
                    >
                    <figcaption>Cada aporte puede acompañar una historia.</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/incluir.js"></script>
</body>
</html>
